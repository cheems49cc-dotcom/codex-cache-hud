name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Core checks
        run: dotnet run --project tests-dotnet/CodexMonitorHud.Core.Tests -c Release
      - name: WPF checks
        run: dotnet run --project tests-dotnet/CodexMonitorHud.App.Tests -c Release
      - name: Portable release
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          retention-days: 7
